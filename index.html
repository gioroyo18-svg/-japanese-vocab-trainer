<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Japanese Vocab Trainer</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f4f6;color:#111827}.app{max-width:520px;margin:auto;min-height:100vh;background:white;padding:20px 18px 32px}h1{font-size:25px;margin:8px 0 4px}.sub{color:#6b7280;margin-bottom:18px}.card{background:#f9fafb;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #0000000d}.word{font-size:40px;font-weight:700;text-align:center;margin:12px 0 5px}.meaning{text-align:center;color:#6b7280;font-size:18px}input{width:100%;padding:15px;border:2px solid #d1d5db;border-radius:12px;font-size:22px;text-align:center;margin-top:16px}button{width:100%;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:700;background:#111827;color:white;margin-top:10px}button.secondary{background:#e5e7eb;color:#111827}.feedback{text-align:center;font-size:18px;font-weight:700;margin-top:14px;min-height:25px}.stats{display:flex;gap:10px}.stat{flex:1;background:#f3f4f6;padding:12px;border-radius:12px;text-align:center}.num{font-size:22px;font-weight:800}.small{font-size:13px;color:#6b7280;text-align:center;margin-top:16px}.hidden{display:none}</style></head><body><div class="app"><h1>🇯🇵 Japanese Vocab Trainer</h1><div class="sub">N5–N4 • Daily Hiragana Practice</div><div class="stats"><div class="stat"><div class="num" id="score">0</div>Score</div><div class="stat"><div class="num" id="total">0</div>Answered</div><div class="stat"><div class="num" id="streak">0</div>Streak</div></div><div class="card"><div id="counter" style="text-align:center;color:#6b7280">Question 1</div><div class="word" id="word">食べる</div><div class="meaning" id="meaning">to eat</div><input id="answer" placeholder="Type hiragana" autocomplete="off" autocapitalize="none"><button onclick="check()">Check</button><div class="feedback" id="feedback"></div><button class="secondary hidden" id="next" onclick="nextQuestion()">Next</button></div><button class="secondary" onclick="resetDay()">Reset Today</button><div class="small">Type the reading in hiragana. Example: たべる</div></div><script>const words=[["食べる","たべる","to eat"],["飲む","のむ","to drink"],["見る","みる","to see / watch"],["聞く","きく","to listen / ask"],["行く","いく","to go"],["来る","くる","to come"],["帰る","かえる","to return home"],["買う","かう","to buy"],["読む","よむ","to read"],["書く","かく","to write"],["話す","はなす","to speak"],["使う","つかう","to use"],["待つ","まつ","to wait"],["作る","つくる","to make"],["分かる","わかる","to understand"],["大きい","おおきい","big"],["小さい","ちいさい","small"],["新しい","あたらしい","new"],["古い","ふるい","old"],["暑い","あつい","hot"],["寒い","さむい","cold"],["楽しい","たのしい","fun"],["難しい","むずかしい","difficult"],["簡単","かんたん","easy / simple"],["学校","がっこう","school"],["先生","せんせい","teacher"],["友達","ともだち","friend"],["会社","かいしゃ","company"],["電車","でんしゃ","train"],["駅","えき","station"]];let qIndex=0,score=0,total=0,streak=0,answered=false;const $=id=>document.getElementById(id);function load(){let s=JSON.parse(localStorage.getItem("jvocab")||"{}");let d=new Date().toISOString().slice(0,10);if(s.date===d){score=s.score||0;total=s.total||0;streak=s.streak||0}qIndex=Math.floor(Math.random()*words.length);show()}function show(){let w=words[qIndex];$("word").textContent=w[0];$("meaning").textContent=w[2];$("answer").value="";$("feedback").textContent="";$("next").classList.add("hidden");$("counter").textContent="Question "+(total+1);answered=false;setTimeout(()=>$("answer").focus(),50)}function check(){if(answered)return;let a=$("answer").value.trim().normalize("NFKC"),c=words[qIndex][1];if(!a){$("feedback").textContent="Type your answer first.";return}answered=true;total++;if(a===c){score++;streak++;$("feedback").textContent="✅ Correct! "+c}else{streak=0;$("feedback").textContent="❌ Correct answer: "+c}update();$("next").classList.remove("hidden");save()}function nextQuestion(){qIndex=Math.floor(Math.random()*words.length);show()}function update(){$("score").textContent=score;$("total").textContent=total;$("streak").textContent=streak}function save(){localStorage.setItem("jvocab",JSON.stringify({date:new Date().toISOString().slice(0,10),score,total,streak}))}function resetDay(){if(confirm("Reset today's score?")){score=0;total=0;streak=0;save();update();show()}}$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});load();update();</script></body></html>
